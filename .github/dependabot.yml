version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      android-build-toolchain:
        patterns:
          - "com.android.application"
          - "gradle-wrapper"
        update-types:
          - minor
          - patch
      android-libraries:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # These versions need compileSdk 37+, but the app currently compiles against 36.
      # Re-evaluate these holds in a planned SDK migration, rather than silently breaking CI.
      - dependency-name: "androidx.compose:compose-bom"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "androidx.core:core-ktx"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      ci-actions:
        patterns:
          - "*"
